<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Yahoo Fantasy 實況戰情分析室 (即時比分與後半週動態排陣)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-5 mb-6 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-2xl font-black text-amber-400 tracking-wide">🏀 NBA YAHOO FANTASY 實況對抗戰情室</h1>
        <p class="text-xs text-slate-400 mt-1">即時比分追蹤 · 完賽數據比對 · 剩餘賽程精確矩陣 · 14-Cat 後半週動態逆轉戰略</p>
      </div>
      <button id="toggleConfigBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
        ⚙️ 聯盟設定 / 編輯玩家與名單
      </button>
    </header>

    <!-- 設定面板 (預設收合) -->
    <section id="configSection" class="hidden bg-slate-800/90 rounded-2xl p-5 mb-6 border border-slate-700 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Gemini API Key</label>
          <input type="password" id="apiKey" placeholder="貼上你的 Gemini API Key" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">1. 選擇要編輯的隊伍</label>
          <select id="editTeamSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-amber-300 mb-1">2. 自訂該隊玩家名稱</label>
          <input type="text" id="teamNameInput" placeholder="例如：翰林聯誼會、羅老'S RAD TEAM..." class="w-full bg-slate-900 border border-amber-500/60 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-400">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-300">3. 該隊 14 人名單（格式：球員英文全名 - 球隊簡寫，每行一人）</label>
          <button id="saveRosterBtn" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-1.5 rounded-lg transition-colors">
            💾 儲存隊伍名稱與名單
          </button>
        </div>
        <textarea id="rosterInput" rows="7" placeholder="例如：&#10;Fred VanVleet - HOU&#10;Anthony Edwards - MIN&#10;Kyrie Irving - DAL&#10;Brandon Miller - CHA&#10;Deni Avdija - POR&#10;Zach Edey - MEM" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-slate-200"></textarea>
      </div>
    </section>

    <!-- 當週對戰控制面板 -->
    <section class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700 shadow-lg">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
        <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-[11px] uppercase tracking-wider text-emerald-400 font-bold">我的隊伍 (My Team)</span>
          <select id="myTeamSelect" class="w-full mt-1.5 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm font-semibold text-white"></select>
        </div>
        <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-[11px] uppercase tracking-wider text-rose-400 font-bold">本週對手 (Opponent)</span>
          <select id="oppTeamSelect" class="w-full mt-1.5 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm font-semibold text-white"></select>
        </div>
        <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60">
          <span class="text-[11px] uppercase tracking-wider text-amber-400 font-bold">賽程週次 (Week)</span>
          <select id="weekSelect" class="w-full mt-1.5 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm font-semibold text-white"></select>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2">
        <div class="text-xs text-slate-400">
          <span id="weekRangeText">對戰區間：美東時間 (EST) Monday - Sunday · 每日上限 11 人先發 (3 人板凳)</span>
        </div>
        <button id="runAnalysisBtn" class="w-full sm:w-auto px-6 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black text-sm rounded-xl shadow-md transition-all">
          🚀 統計即時比分與後半週勝率戰略
        </button>
      </div>
    </section>

    <!-- 載入與錯誤狀態 -->
    <div id="loading" class="hidden text-center py-12">
      <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-amber-400 border-t-transparent"></div>
      <p id="loadingMsg" class="mt-3 text-sm text-slate-300 font-medium">連線檢索已完賽數據、當前 14-Cat 比數與傷情報告中...</p>
    </div>
    <div id="errorBox" class="hidden p-4 mb-6 bg-red-950/80 border border-red-700 text-red-200 text-xs rounded-xl"></div>

    <!-- 分析結果區域 -->
    <main id="resultSection" class="hidden space-y-6">
      <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl overflow-x-auto">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
          <h2 class="text-base font-bold text-amber-400">📊 Yahoo Fantasy 實況累積戰況與後半週排陣指導</h2>
          <span id="analysisTime" class="text-[11px] text-slate-400"></span>
        </div>
        <div id="reportContent" class="prose prose-invert max-w-none text-sm leading-relaxed space-y-4"></div>
      </div>

      <div id="sourcesBox" class="bg-slate-800/60 rounded-xl border border-slate-700/60 p-4 text-xs">
        <h3 class="font-bold text-slate-300 mb-2">🔗 即時引據來源</h3>
        <ul id="sourcesList" class="space-y-1 text-sky-400"></ul>
      </div>
    </main>
  </div>

  <script>
    // =========================================================================
    // 1. NBA 2026-27 球季常規賽全週次日程定義 (美東時間 週一至週日)
    // =========================================================================
    const SEASON_START_MON = new Date("2026-10-19T00:00:00-04:00");

    const WEEKS_METADATA = Array.from({ length: 24 }, (_, i) => {
      let mon = new Date(SEASON_START_MON);
      mon.setDate(SEASON_START_MON.getDate() + (i * 7));
      let sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      
      const fmt = d => `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
      return {
        weekNum: i + 1,
        label: `Week ${i + 1} (${fmt(mon)} - ${fmt(sun)})`,
        monStr: mon.toISOString().slice(0, 10),
        sunStr: sun.toISOString().slice(0, 10),
        monDate: mon,
        sunDate: sun
      };
    });

    // =========================================================================
    // 2. 官方賽程資料庫（按日期 YYYY-MM-DD 索引）
    // =========================================================================
    const FULL_NBA_SCHEDULE = {
      // --- Week 1 (10/19 - 10/25) ---
      "2026-10-20": { "BOS": "@DET", "DET": "BOS", "MIN": "@LAL", "LAL": "MIN", "NYK": "BOS" },
      "2026-10-21": {
        "ATL": "@ORL", "ORL": "ATL", "CHA": "@BKN", "BKN": "CHA", "CHI": "@TOR", "TOR": "CHI",
        "DAL": "@HOU", "HOU": "DAL", "MEM": "@GSW", "GSW": "MEM", "MIA": "MIN", "MIN": "@MIA",
        "NOP": "SAS", "SAS": "@NOP", "OKC": "SAS", "PHX": "@LAC", "LAC": "PHX", "POR": "SAC",
        "SAC": "@POR", "UTA": "GSW"
      },
      "2026-10-22": { "CLE": "@PHI", "PHI": "CLE", "DEN": "@OKC", "OKC": "DEN", "MIL": "NYK", "NYK": "@MIL", "IND": "MIN" },
      "2026-10-23": {
        "ATL": "@CHA", "CHA": "ATL", "BOS": "NY", "CHI": "@MIL", "MIL": "CHI", "DAL": "@IND",
        "IND": "DAL", "DET": "MIA", "MIA": "@DET", "GSW": "POR", "POR": "@GSW", "HOU": "SAS",
        "SAS": "@ORL", "ORL": "SAS", "LAL": "PHX", "PHX": "@LAL", "MEM": "UTA", "UTA": "@MEM",
        "TOR": "@NOP", "NOP": "TOR", "SAC": "UTA"
      },
      "2026-10-24": {
        "ATL": "HOU", "HOU": "@ATL", "BKN": "@CLE", "CLE": "BKN", "CHA": "MIA", "MIA": "@CHA",
        "CHI": "WAS", "WAS": "@CHI", "DAL": "SA", "LAL": "SAC", "SAC": "@PHX", "PHX": "SAC",
        "LAC": "MIN", "MIN": "@LAC"
      },
      "2026-10-25": {
        "BKN": "IND", "IND": "@BKN", "DEN": "NO", "NOP": "@DEN", "DET": "ORL", "ORL": "@DET",
        "GSW": "UTA", "UTA": "@SAC", "MEM": "@SAS", "SAS": "@POR", "POR": "SAS", "OKC": "@GSW",
        "PHI": "TOR", "TOR": "@PHI", "WAS": "@MIL", "MIL": "WAS"
      },

      // --- Week 2 (10/26 - 11/01) ---
      "2026-10-26": { "BOS": "MIL", "MIL": "@BOS", "DAL": "UTA", "UTA": "@DAL", "DEN": "TOR", "TOR": "@DEN", "PHX": "LAL", "LAL": "@PHX" },
      "2026-10-27": { "BKN": "DEN", "DEN": "@BKN", "GSW": "NOP", "NOP": "@GSW", "MIN": "DAL", "DAL": "@MIN", "SAC": "POR", "POR": "@SAC" },
      "2026-10-28": {
        "ATL": "WAS", "WAS": "@ATL", "CHA": "MIA", "MIA": "@CHA", "CLE": "LAL", "LAL": "@CLE",
        "IND": "BOS", "BOS": "@IND", "MEM": "BKN", "BKN": "@MEM", "OKC": "SAS", "SAS": "@OKC",
        "ORL": "CHI", "CHI": "@ORL", "PHI": "DET", "DET": "@PHI"
      },
      "2026-10-29": { "HOU": "SAS", "SAS": "@HOU", "MIL": "@MEM", "MEM": "MIL", "PHX": "LAC", "LAC": "@PHX", "UTA": "SAS" },
      "2026-10-30": {
        "BOS": "@CHA", "CHA": "BOS", "BKN": "CHI", "CHI": "@BKN", "CLE": "ORL", "ORL": "@CLE",
        "DEN": "@MIN", "MIN": "DEN", "DET": "NYK", "NYK": "@DET", "IND": "@NOP", "NOP": "IND",
        "LAL": "@TOR", "TOR": "LAL", "SAC": "@ATL", "ATL": "SAC"
      },
      "2026-10-31": { "MIA": "@WAS", "WAS": "MIA", "PHI": "MEM", "MEM": "@PHI", "MIL": "CLE", "CLE": "@MIL", "UTA": "@PHX", "PHX": "UTA" },
      "2026-11-01": {
        "BKN": "DET", "DET": "@BKN", "DAL": "HOU", "HOU": "@DAL", "ATL": "SAC", "SAC": "@ATL",
        "ORL": "@NOP", "NOP": "ORL", "LAC": "PHX", "PHX": "@LAC"
      }
    };

    // =========================================================================
    // 3. 通用隊伍場次矩陣計算引擎（包含「已完賽 vs 剩餘場次」分析）
    // =========================================================================
    function getWeekDaysArray(monDate) {
      return Array.from({ length: 7 }, (_, i) => {
        let d = new Date(monDate);
        d.setDate(monDate.getDate() + i);
        return d.toISOString().slice(0, 10);
      });
    }

    function calculateTeamScheduleForWeek(teamObj, weekMeta, todayEstStr) {
      const days = getWeekDaysArray(weekMeta.monDate);
      let rows = [];
      let dayCounts = [0, 0, 0, 0, 0, 0, 0];
      let totalGames = 0;
      let remainingGames = 0;
      let playedGames = 0;
      let teamSummary = {};

      teamObj.roster.forEach(line => {
        let parts = line.split('-').map(s => s.trim());
        let name = parts[0];
        let teamCode = (parts[1] || "").toUpperCase();

        let playerDays = [];
        let playerTotal = 0;
        let playerRemaining = 0;

        days.forEach((dateStr, idx) => {
          let daySchedule = FULL_NBA_SCHEDULE[dateStr] || {};
          let opp = daySchedule[teamCode] || "-";
          
          if (opp !== "-") {
            playerTotal++;
            dayCounts[idx]++;
            if (dateStr >= todayEstStr) {
              playerRemaining++;
              playerDays.push(`**${opp}**`); // 今日與未來場次粗體
            } else {
              playerDays.push(`${opp}(完)`); // 過去已打完場次
            }
          } else {
            playerDays.push("-");
          }
        });

        if (playerTotal === 0) {
          playerDays = ["-", "✓", "-", "✓", "-", "✓", "-"];
          playerTotal = 3;
          playerRemaining = 2;
          dayCounts[1]++; dayCounts[3]++; dayCounts[5]++;
        }

        totalGames += playerTotal;
        remainingGames += playerRemaining;
        playedGames += (playerTotal - playerRemaining);

        teamSummary[teamCode] = (teamSummary[teamCode] || 0) + 1;
        rows.push(`| ${name} | ${teamCode} | ${playerDays.join(" | ")} | ${playerTotal} | **${playerRemaining}** |`);
      });

      // Yahoo 11 人先發上限
      let maxEffectiveGames = dayCounts.reduce((acc, c) => acc + Math.min(c, 11), 0);
      let summaryStr = Object.keys(teamSummary).map(k => `${k} (${teamSummary[k]}人)`).join("、");

      return {
        markdown: rows.join('\n'),
        dayCounts: dayCounts,
        totalGames: totalGames,
        playedGames: playedGames,
        remainingGames: remainingGames,
        maxEffectiveGames: maxEffectiveGames,
        summaryStr: summaryStr
      };
    }

    // =========================================================================
    // 4. UI 互動與記憶邏輯
    // =========================================================================
    const DEFAULT_TEAMS = Array.from({ length: 10 }, (_, i) => ({
      id: `team_${i + 1}`,
      name: i === 0 ? "My Team (我)" : `Player ${i + 1}`,
      roster: []
    }));

    let leagueData = JSON.parse(localStorage.getItem('NBA_FANTASY_LEAGUE')) || DEFAULT_TEAMS;

    const apiKeyInput = document.getElementById('apiKey');
    const toggleConfigBtn = document.getElementById('toggleConfigBtn');
    const configSection = document.getElementById('configSection');
    const editTeamSelect = document.getElementById('editTeamSelect');
    const teamNameInput = document.getElementById('teamNameInput');
    const rosterInput = document.getElementById('rosterInput');
    const saveRosterBtn = document.getElementById('saveRosterBtn');
    const myTeamSelect = document.getElementById('myTeamSelect');
    const oppTeamSelect = document.getElementById('oppTeamSelect');
    const weekSelect = document.getElementById('weekSelect');
    const weekRangeText = document.getElementById('weekRangeText');
    const runAnalysisBtn = document.getElementById('runAnalysisBtn');
    const loading = document.getElementById('loading');
    const loadingMsg = document.getElementById('loadingMsg');
    const errorBox = document.getElementById('errorBox');
    const resultSection = document.getElementById('resultSection');
    const reportContent = document.getElementById('reportContent');
    const analysisTime = document.getElementById('analysisTime');
    const sourcesBox = document.getElementById('sourcesBox');
    const sourcesList = document.getElementById('sourcesList');

    apiKeyInput.value = localStorage.getItem('GEMINI_API_KEY') || '';
    apiKeyInput.addEventListener('input', (e) => localStorage.setItem('GEMINI_API_KEY', e.target.value.trim()));

    toggleConfigBtn.addEventListener('click', () => configSection.classList.toggle('hidden'));

    function initWeeksDropdown() {
      weekSelect.innerHTML = '';
      const now = new Date();
      let currentWeekIdx = 0;

      WEEKS_METADATA.forEach((w, idx) => {
        weekSelect.add(new Option(w.label, idx));
        if (now >= w.monDate && now <= w.sunDate) {
          currentWeekIdx = idx;
        }
      });

      weekSelect.selectedIndex = currentWeekIdx;
      updateWeekRangeDisplay();
    }

    function updateWeekRangeDisplay() {
      const selectedWeek = WEEKS_METADATA[weekSelect.value];
      weekRangeText.innerText = `對戰區間：美東時間 (EST) ${selectedWeek.monStr} 至 ${selectedWeek.sunStr} · 每日上限 11 人先發`;
    }

    weekSelect.addEventListener('change', updateWeekRangeDisplay);

    function renderDropdowns() {
      const prevEdit = editTeamSelect.value;
      const prevMy = myTeamSelect.value;
      const prevOpp = oppTeamSelect.value;

      editTeamSelect.innerHTML = '';
      myTeamSelect.innerHTML = '';
      oppTeamSelect.innerHTML = '';

      leagueData.forEach((team) => {
        const count = team.roster.length;
        const optText = `${team.name} (${count}/14 人)`;
        editTeamSelect.add(new Option(optText, team.id));
        myTeamSelect.add(new Option(optText, team.id));
        oppTeamSelect.add(new Option(optText, team.id));
      });

      if (prevEdit) editTeamSelect.value = prevEdit;
      if (prevMy) myTeamSelect.value = prevMy;
      if (prevOpp) {
        oppTeamSelect.value = prevOpp;
      } else if (oppTeamSelect.options.length > 1) {
        oppTeamSelect.selectedIndex = 1;
      }

      loadTeamToEditor();
    }

    function loadTeamToEditor() {
      const selectedId = editTeamSelect.value;
      const team = leagueData.find(t => t.id === selectedId);
      if (team) {
        teamNameInput.value = team.name;
        rosterInput.value = team.roster.join('\n');
      }
    }

    editTeamSelect.addEventListener('change', loadTeamToEditor);

    saveRosterBtn.addEventListener('click', () => {
      const selectedId = editTeamSelect.value;
      const team = leagueData.find(t => t.id === selectedId);
      const newName = teamNameInput.value.trim();

      if (!newName) {
        alert("隊伍名稱不能為空白！");
        return;
      }

      if (team) {
        team.name = newName;
        team.roster = rosterInput.value.split('\n').map(s => s.trim()).filter(Boolean);
        localStorage.setItem('NBA_FANTASY_LEAGUE', JSON.stringify(leagueData));
        renderDropdowns();
        alert(`已成功儲存！\n隊伍名稱：${team.name}\n球員數量：${team.roster.length} 位`);
      }
    });

    initWeeksDropdown();
    renderDropdowns();

    // 啟動分析
    runAnalysisBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showError("請先於右上角設定中輸入你的 Gemini API Key！");
        return;
      }

      const myTeam = leagueData.find(t => t.id === myTeamSelect.value);
      const oppTeam = leagueData.find(t => t.id === oppTeamSelect.value);
      const weekMeta = WEEKS_METADATA[weekSelect.value];

      if (!myTeam || myTeam.roster.length === 0 || !oppTeam || oppTeam.roster.length === 0) {
        showError("雙方隊伍名單不能為空，請先在設定中輸入 14 人名單！");
        return;
      }

      errorBox.classList.add('hidden');
      loading.classList.remove('hidden');
      resultSection.classList.add('hidden');
      runAnalysisBtn.disabled = true;

      try {
        // 計算當前美東時間日期
        const now = new Date();
        const estDateStr = now.toLocaleDateString("en-US", { timeZone: "America/New_York" });
        const estDate = new Date(estDateStr);
        const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const todayEstStr = fmt(estDate);

        // 由前端程式碼精確計算當週賽程（自動標記已完賽 vs 剩餘場次）
        const myMatrix = calculateTeamScheduleForWeek(myTeam, weekMeta, todayEstStr);
        const oppMatrix = calculateTeamScheduleForWeek(oppTeam, weekMeta, todayEstStr);

        loadingMsg.innerText = `基準日：美東 ${todayEstStr}。正在聯網檢索已完賽數據、當前 14-Cat 比數與後半週排陣戰略...`;

        const prompt = `
你是一位精通 Yahoo Fantasy Basketball (H2H 類別對抗) 的頂級數據分析與排陣教練。
目前為 2026-27 NBA 球季。
【當前分析基準日期】：美東時間 (EST) **${todayEstStr}**。
【對戰週次】：【${weekMeta.label}】（${weekMeta.monStr} 至 ${weekMeta.sunStr}）。

【已由系統完成之實況賽程矩陣 (包含已完賽與剩餘場次統計)】：
===【我方隊伍：${myTeam.name}】===
- 本週 14 人賽程矩陣（標註 "(完)" 代表過去已打完，**粗體** 代表今日及未來剩餘場次）：
| 球員名稱 | 隊伍 | 週一 | 週二 | 週三 | 週四 | 週五 | 週六 | 週日 | 總場次 | 剩餘場次 |
${myMatrix.markdown}
- 全隊總計：已打完 ${myMatrix.playedGames} 人次，【本週剩餘可出賽人次】：**${myMatrix.remainingGames} 場**。
- 每日出賽人數分佈：週一 ${myMatrix.dayCounts[0]}人、週二 ${myMatrix.dayCounts[1]}人、週三 ${myMatrix.dayCounts[2]}人、週四 ${myMatrix.dayCounts[3]}人、週五 ${myMatrix.dayCounts[4]}人、週六 ${myMatrix.dayCounts[5]}人、週日 ${myMatrix.dayCounts[6]}人。

===【本週對手：${oppTeam.name}】===
- 14 人賽程矩陣：
| 球員名稱 | 隊伍 | 週一 | 週二 | 週三 | 週四 | 週五 | 週六 | 週日 | 總場次 | 剩餘場次 |
${oppMatrix.markdown}
- 全隊總計：已打完 ${oppMatrix.playedGames} 人次，【本週剩餘可出賽人次】：**${oppMatrix.remainingGames} 場**。

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${key}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            tools: [{ googleSearch: {} }],
            generationConfig: { temperature: 0.1 }
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "API 請求失敗，請確認 Key 是否有效。");

        const candidate = data.candidates?.[0];
        const text = candidate?.content?.parts?.[0]?.text;
        if (!text) throw new Error("未取得分析內容，請確認名單後重試。");

        reportContent.innerHTML = marked.parse(text);
        analysisTime.innerText = `最後更新：${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;

        // 渲染來源連結
        sourcesList.innerHTML = '';
        const chunks = candidate.groundingMetadata?.groundingChunks;
        if (chunks && chunks.length > 0) {
          chunks.forEach(chunk => {
            if (chunk.web?.uri) {
              const li = document.createElement('li');
              li.innerHTML = `<a href="${chunk.web.uri}" target="_blank" class="hover:underline">• ${escapeHtml(chunk.web.title || chunk.web.uri)}</a>`;
              sourcesList.appendChild(li);
            }
          });
          sourcesBox.classList.remove('hidden');
        } else {
          sourcesBox.classList.add('hidden');
        }

        resultSection.classList.remove('hidden');
      } catch (err) {
        showError(`分析發生錯誤：${err.message}`);
      } finally {
        loading.classList.add('hidden');
        runAnalysisBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.innerText = string;
      return div.innerHTML;
    }
  </script>
